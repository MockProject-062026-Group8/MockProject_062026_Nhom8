<header class="navbar">
  <div class="navbar-left">
    <h2 style="margin: 0; font-size: 20px; color: #1e293b;">{% block navbar_title %}Dashboard{% endblock %}</h2>
  </div>
  <div class="navbar-right" style="display: flex; align-items: center;">
    <div class="admin-header__right" style="display: flex; align-items: center; gap: 16px;">
        <!-- Notification bell -->
        <button class="header-icon-btn" id="btnNotifications" aria-label="Notifications" title="Notifications" style="background: none; border: none; font-size: 20px; color: #64748b; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; padding: 0; margin: 0; width: 32px; height: 32px;">
            <i class="fas fa-bell"></i>
            <span class="notif-badge" style="position: absolute; top: -4px; right: -4px; background: #ef4444; color: white; font-size: 10px; padding: 2px 5px; border-radius: 10px; font-weight: bold; line-height: 1;">3</span>
        </button>

        <!-- Help -->
        <button class="header-icon-btn" id="btnHelp" aria-label="Help" title="Help & Documentation" style="background: none; border: none; font-size: 20px; color: #64748b; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; margin: 0; width: 32px; height: 32px;">
            <i class="fas fa-circle-question"></i>
        </button>

        <!-- User menu -->
        <div class="user-menu" id="userMenuToggle" role="button" aria-haspopup="true" aria-expanded="false" style="display: flex; align-items: center; cursor: pointer; position: relative; gap: 10px;">
            <div class="user-avatar" style="width: 36px; height: 36px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #475569; font-weight: bold; font-size: 14px;">
                AL
            </div>
            <div class="user-info" style="display: flex; flex-direction: column; justify-content: center;">
                <span class="user-name" style="font-size: 14px; font-weight: 600; color: #1e293b; line-height: 1.2;">Anna Lee</span>
                <span class="user-role" style="font-size: 12px; color: #64748b; line-height: 1.2;">Nurse</span>
            </div>
            <i class="fas fa-chevron-down user-chevron" style="font-size: 12px; color: #94a3b8; margin-left: 4px;"></i>

            <!-- Dropdown menu -->
            <div class="user-dropdown" id="userDropdown" role="menu" style="display: none; position: absolute; top: 100%; right: 0; background: white; border: 1px solid #e2e8f0; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 200px; padding: 8px 0; z-index: 1000; margin-top: 10px;">
                <a href="#" role="menuitem" style="display: block; padding: 8px 16px; color: #475569; text-decoration: none; font-size: 14px;">
                    <i class="fas fa-user-circle" style="width: 20px;"></i> My Profile
                </a>
                <a href="#" role="menuitem" style="display: block; padding: 8px 16px; color: #475569; text-decoration: none; font-size: 14px;">
                    <i class="fas fa-gear" style="width: 20px;"></i> Account Settings
                </a>
                <div class="dropdown-divider" style="height: 1px; background: #e2e8f0; margin: 8px 0;"></div>
                <a href="{% url 'accounts:login' %}" class="logout-link" role="menuitem" style="display: block; padding: 8px 16px; color: #ef4444; text-decoration: none; font-size: 14px;">
                    <i class="fas fa-right-from-bracket" style="width: 20px;"></i> Sign Out
                </a>
            </div>
        </div>
    </div>
  </div>
</header>
<script>
    document.getElementById('userMenuToggle').addEventListener('click', function() {
        var dropdown = document.getElementById('userDropdown');
        dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
    });
</script>
