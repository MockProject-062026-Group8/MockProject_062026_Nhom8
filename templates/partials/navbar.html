<header class="admin-header">
    <!-- Left: hamburger + logo -->
    <div class="admin-header__left">
        <button class="hamburger-btn" id="sidebarToggle" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
        </button>
        <div class="admin-logo">
            <span class="admin-logo__abbr">NHMS</span>
            <span class="admin-logo__full">Nursing Home Management System</span>
        </div>
    </div>

    <!-- Right: notification, help, user -->
    <div class="admin-header__right">
        <!-- Notification bell -->
        <button class="header-icon-btn" id="btnNotifications" aria-label="Notifications" title="Notifications">
            <i class="fas fa-bell"></i>
            <span class="notif-badge">3</span>
        </button>

        <!-- Help -->
        <button class="header-icon-btn" id="btnHelp" aria-label="Help" title="Help & Documentation">
            <i class="fas fa-circle-question"></i>
        </button>

        <!-- User menu -->
        <div class="user-menu" id="userMenuToggle" role="button" aria-haspopup="true" aria-expanded="false">
            <div class="user-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="user-info">
                <span class="user-name">Victor Alvarez</span>
                <span class="user-role">System Admin</span>
            </div>
            <i class="fas fa-chevron-down user-chevron"></i>

            <!-- Dropdown menu -->
            <div class="user-dropdown" id="userDropdown" role="menu">
                <a href="#" role="menuitem">
                    <i class="fas fa-user-circle"></i> My Profile
                </a>
                <a href="#" role="menuitem">
                    <i class="fas fa-gear"></i> Account Settings
                </a>
                <div class="dropdown-divider"></div>
                <a href="{% url 'accounts:login' %}" class="logout-link" role="menuitem">
                    <i class="fas fa-right-from-bracket"></i> Sign Out
                </a>
            </div>
        </div>
    </div>
</header>
