<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to NHMS</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-badge">N</div>
                <h1>Sign in to NHMS</h1>
                <p>Nursing Home Management System</p>
            </div>
            
            <form id="loginForm" class="login-form" data-api-url="/api/v1/auth/login/" data-redirect-url="{% url 'accounts:2step_verification' %}">
                <div class="error-banner" id="errorMessage" style="display: none;"></div>
                
                <div class="form-group">
                    <label for="identifier">Email or Phone</label>
                    <input type="text" id="identifier" name="identifier" placeholder="name@facility.org or +1 555 000 1234">
                </div>
                
                <div class="form-group">
                    <div class="password-label-group">
                        <label for="password">Password</label>
                        <a href="{% url 'accounts:forgot_password' %}" class="forgot-link">Forgot password?</a>
                    </div>
                    <input type="password" id="password" name="password" placeholder="••••••••">
                </div>
                
                <button type="submit" id="submitBtn" class="btn-primary">Sign In</button>
            </form>
        </div>
        <div class="login-footer">
            <p>Accounts are provisioned by your administrator.</p>
            <p>Need access? Contact your NHMS admin.</p>
        </div>
    </div>
    
    <script src="/static/js/login.js"></script>
</body>
</html>
