{% load static %}

<link rel="stylesheet" href="{% static '/css/activate.css' %}">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{% static 'accounts/css/activate.css' %}">
</head>

<body>

<div class="page">

    <div class="card-box">

        <!-- Logo -->
        <div class="logo">
            N
        </div>

        <!-- Title -->
        <h2 class="title">
            Activate your account
        </h2>

        <!-- Success Message -->
        <div class="alert alert-success">
            <i class="bi bi-check-circle-fill me-2"></i>
            Invited by Administrator • Link valid 72h
        </div>

        <form method="post">

            {% csrf_token %}

            <!-- Email -->
            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <div class="input-group">

                    <input
                        type="email"
                        class="form-control"
                        placeholder="j.rivera@facility.org"
                        >

                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>

                </div>

                <small class="text-secondary">
                    Set by admin — read-only
                </small>

            </div>

            <!-- Password -->
            <div class="mb-3">

                <label class="form-label">
                    Set password <span class="text-danger">*</span>
                </label>

                <input
                    type="password"
                    class="form-control"
                    placeholder="At least 8 chars, mixed case + number">

            </div>

            <!-- Confirm Password -->
            <div class="mb-3">

                <label class="form-label">
                    Confirm password <span class="text-danger">*</span>
                </label>

                <input
                    type="password"
                    class="form-control"
                    placeholder="Re-enter password">

            </div>

            <!-- Phone -->
            <div class="mb-3">

                <label class="form-label">
                    Phone number <span class="text-danger">*</span>
                </label>

                <input
                    type="text"
                    class="form-control"
                    placeholder="+1 555 000 1234">

                <small class="text-secondary">
                    Used for 2-step verification codes.
                </small>

            </div>

            <!-- Terms -->
            <div class="form-check mb-4">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="agree">

                <label
                    class="form-check-label"
                    for="agree">

                    I accept the Terms of Use &amp; Privacy Policy

                </label>

            </div>

            <!-- Button -->
            <button
                type="submit"
                class="btn btn-primary w-100">

                Activate account

            </button>

        </form>

    </div>

</div>

</body>
</html>
