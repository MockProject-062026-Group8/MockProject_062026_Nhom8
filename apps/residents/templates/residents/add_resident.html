{% extends 'base.html' %}
{% block title %}Add Resident{% endblock %} 
{% block content %}
<div class="container">
  <div class="breadcrumb">Resident List > New Resident</div>
  <h2>New Resident</h2>
  <form method="post" action="">
    {% csrf_token %}

    <h4>PERSONAL INFORMATION</h4>
    <hr />

    <div class="row">
      <!-- Cột trái 50% -->
      <div class="col-50 form-group">
        <label>First Name *</label>
        <input type="text" name="first_name" required />
      </div>
      <!-- Cột phải 50% -->
      <div class="col-50 form-group">
        <label>Last Name *</label>
        <input type="text" name="last_name" required />
      </div>
    </div>
    <div class="row">
      <!-- Cột trái 50% -->
      <div class="col-50 form-group">
        <label>Date of Birth *</label>
        <input type="date" name="dob" required />
      </div>
      <!-- Cột phải 50% -->
      <div class="col-50 form-group">
        <label>Gender *</label>
        <select name="gender" required>
          <option value="">Select...</option>
          <option value="M">Male</option>
          <option value="F">Female</option>
        </select>
      </div>
    </div>
    <!-- Các phần khác tương tự... -->
    <div style="margin-top: 20px">
      <button
        type="submit"
        style="
          background: #222;
          color: white;
          padding: 10px 20px;
          border: none;
          cursor: pointer;
        "
      >
        Save Resident
      </button>
      <button
        type="button"
        style="
          background: #fff;
          color: #333;
          padding: 10px 20px;
          border: 1px solid #ccc;
          margin-left: 10px;
          cursor: pointer;
        "
      >
        Cancel
      </button>
    </div>
  </form>
</div>
{% endblock %}
